services:
  # Web Service - Full-stack Node.js app
  - type: web
    name: sovereign-agent-ai
    env: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=2048
      - key: DATABASE_URL
        fromDatabase:
          name: sovereign-agent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_TITLE
        value: Sovereign Agent
      - key: VITE_APP_LOGO
        value: /sovereign-agent-logo.png
      # User must add via Render dashboard:
      # - OPENAI_API_KEY (required for image generation and chat)

databases:
  - name: sovereign-agent-db
    databaseName: sovereign_agent
    user: sovereign_agent_user
    region: frankfurt
    plan: free
